name: Test clean source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            python: .venv/bin/python
          - os: windows-2025
            arch: x64
            python: .venv/Scripts/python.exe
          - os: macos-14
            arch: arm64
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.arch }}
          cache: pip
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install dependencies
        run: ${{ matrix.python }} -m pip install -r requirements.txt
      - name: Verify source-only distribution
        run: ${{ matrix.python }} tools/check_distribution.py
      - name: Test
        run: ${{ matrix.python }} tools/validate.py --evidence .runtime/validation
      - name: Native Qt and disposable-workspace smoke
        run: ${{ matrix.python }} tools/native_smoke.py --output dist/smoke
      - name: Build clean source-client package
        run: ${{ matrix.python }} tools/package_source.py --output dist/hwi4u-source-client.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hwi4u-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
